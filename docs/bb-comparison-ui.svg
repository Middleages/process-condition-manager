  <rect x="746" y="816" width="658" height="132" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="760" y="836" font-size="12" font-weight="600" fill="#0F172A">▾ Backbone 대비 변경 상세 (8개 셀, 3개 레이어)</text>

  <rect x="760" y="846" width="630" height="22" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="770" y="861" font-size="10" fill="#64748B">L2 · LITHO_DUV</text>
