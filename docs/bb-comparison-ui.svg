<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 980" width="1440" height="980" font-family="'Segoe UI', sans-serif">
  <title>BB 비교 패널 UI 시각화</title>
  <desc>조건표 에디터의 Backbone 비교 패널 사용 형태</desc>

  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="980" fill="#F8FAFC"/>

  <!-- ===== Title ===== -->
  <text x="20" y="32" font-size="20" font-weight="700" fill="#0F172A">조건표 에디터 - BB 비교 (Backbone Comparison) 동작 화면</text>
  <text x="20" y="54" font-size="13" fill="#64748B">헤더 버튼 클릭 → 우측 패널 슬라이드 인 → 변경 셀만 빨강(BB)/초록(현재) 으로 비교 표시</text>

  <!-- ===== Editor Window ===== -->
  <rect x="20" y="80" width="1400" height="660" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>

  <!-- Editor Header -->
  <rect x="20" y="80" width="1400" height="56" rx="10" fill="#FFFFFF"/>
  <rect x="20" y="130" width="1400" height="1" fill="#E2E8F0"/>
  <text x="40" y="112" font-size="14" font-weight="600" fill="#0F172A">PRJ-2026-A · 조건표 편집</text>

  <!-- Header buttons -->
  <rect x="900" y="96" width="78" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="939" y="114" font-size="12" fill="#475569" text-anchor="middle">저장</text>

  <rect x="986" y="96" width="90" height="28" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1031" y="114" font-size="12" fill="#475569" text-anchor="middle">검토 요청</text>

  <!-- BB 비교 Button (active) -->
  <rect x="1084" y="96" width="118" height="28" rx="6" fill="#1E3A8A"/>
  <!-- GitCompare icon -->
  <g transform="translate(1094,103)" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="3" cy="3" r="2"/>
    <circle cx="13" cy="13" r="2"/>
    <path d="M5 3h6a2 2 0 0 1 2 2v6"/>
    <path d="M11 13H5a2 2 0 0 1-2-2V5"/>
  </g>
  <text x="1140" y="114" font-size="12" font-weight="600" fill="#FFFFFF">BB 비교</text>
  <!-- Badge with changed-layer count -->
  <circle cx="1190" cy="110" r="9" fill="#EF4444"/>
  <text x="1190" y="113.5" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>

  <text x="1218" y="114" font-size="11" fill="#94A3B8">← 변경 레이어 수</text>

  <!-- ===== Left: Layer Nav ===== -->
  <rect x="20" y="136" width="200" height="604" fill="#F8FAFC"/>
  <text x="36" y="160" font-size="11" font-weight="600" fill="#64748B">레이어</text>

  <!-- layer items -->
  <g font-size="12" fill="#334155">
    <rect x="28" y="172" width="184" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="40" y="193">L1 · CMP_OX</text>

    <rect x="28" y="212" width="184" height="34" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
    <text x="40" y="233" font-weight="600" fill="#1E3A8A">L2 · LITHO_DUV</text>
    <!-- diff icon + count -->
    <g transform="translate(170,222)" stroke="#DC2626" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="3" cy="3" r="2"/>
      <circle cx="13" cy="9" r="2"/>
      <path d="M5 3h4a2 2 0 0 1 2 2v2"/>
    </g>
    <text x="195" y="235" font-size="10" font-weight="700" fill="#DC2626">5</text>

    <rect x="28" y="252" width="184" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="40" y="273">L3 · ETCH_DRY</text>
    <g transform="translate(170,262)" stroke="#DC2626" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="3" cy="3" r="2"/>
      <circle cx="13" cy="9" r="2"/>
      <path d="M5 3h4a2 2 0 0 1 2 2v2"/>
    </g>
    <text x="195" y="275" font-size="10" font-weight="700" fill="#DC2626">2</text>

    <rect x="28" y="292" width="184" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="40" y="313">L4 · DEPO_CVD</text>

    <rect x="28" y="332" width="184" height="34" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="40" y="353">L5 · IMP</text>
    <g transform="translate(170,342)" stroke="#DC2626" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="3" cy="3" r="2"/>
      <circle cx="13" cy="9" r="2"/>
      <path d="M5 3h4a2 2 0 0 1 2 2v2"/>
    </g>
    <text x="195" y="355" font-size="10" font-weight="700" fill="#DC2626">1</text>
  </g>

  <!-- ===== Center: Condition Grid (dimmed when panel open) ===== -->
  <rect x="220" y="136" width="780" height="604" fill="#FFFFFF"/>
  <rect x="220" y="136" width="780" height="32" fill="#F1F5F9"/>
  <text x="236" y="156" font-size="11" font-weight="600" fill="#475569">분류 / 컬럼명</text>
  <text x="500" y="156" font-size="11" font-weight="600" fill="#475569">L2 · LITHO_DUV</text>

  <!-- Grid rows -->
  <g font-size="12" fill="#334155">
    <line x1="220" y1="200" x2="1000" y2="200" stroke="#F1F5F9"/>
    <text x="236" y="190">SP · Exposure_Energy</text>
    <text x="640" y="190" fill="#185E0F" font-weight="600">28.5</text>

    <line x1="220" y1="232" x2="1000" y2="232" stroke="#F1F5F9"/>
    <text x="236" y="222">SP · Focus_Offset</text>
    <text x="640" y="222">-0.02</text>

    <line x1="220" y1="264" x2="1000" y2="264" stroke="#F1F5F9"/>
    <text x="236" y="254">SC · Stage_Speed</text>
    <text x="640" y="254" fill="#185E0F" font-weight="600">450</text>

    <line x1="220" y1="296" x2="1000" y2="296" stroke="#F1F5F9"/>
    <text x="236" y="286">OVL · Align_Mark</text>
    <text x="640" y="286">MARK_A</text>

    <line x1="220" y1="328" x2="1000" y2="328" stroke="#F1F5F9"/>
    <text x="236" y="318">DEV · Dev_Time</text>
    <text x="640" y="318" fill="#185E0F" font-weight="600">62</text>

    <line x1="220" y1="360" x2="1000" y2="360" stroke="#F1F5F9"/>
    <text x="236" y="350">SP · NA_Setting</text>
    <text x="640" y="350" fill="#185E0F" font-weight="600">1.35</text>

    <line x1="220" y1="392" x2="1000" y2="392" stroke="#F1F5F9"/>
    <text x="236" y="382">SC · Track_Recipe</text>
    <text x="640" y="382" fill="#185E0F" font-weight="600">RCP_07</text>
  </g>

  <text x="610" y="700" font-size="11" fill="#94A3B8">(메인 그리드 - 현재 값 표시, 변경된 셀만 초록)</text>

  <!-- vertical divider -->
  <line x1="1000" y1="136" x2="1000" y2="740" stroke="#E2E8F0"/>

  <!-- ===== Right: BackboneComparisonPanel (420px wide) ===== -->
  <rect x="1000" y="136" width="420" height="604" fill="#FFFFFF"/>

  <!-- Panel header -->
  <rect x="1000" y="136" width="420" height="44" fill="#F8FAFC"/>
  <line x1="1000" y1="180" x2="1420" y2="180" stroke="#E2E8F0"/>
  <g transform="translate(1016,153)" stroke="#1E3A8A" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="3" cy="3" r="2"/>
    <circle cx="13" cy="13" r="2"/>
    <path d="M5 3h6a2 2 0 0 1 2 2v6"/>
    <path d="M11 13H5a2 2 0 0 1-2-2V5"/>
  </g>
  <text x="1040" y="164" font-size="13" font-weight="700" fill="#0F172A">Backbone 비교</text>
  <text x="1395" y="164" font-size="16" fill="#64748B" text-anchor="middle">×</text>

  <!-- Summary stats -->
  <rect x="1012" y="192" width="396" height="56" rx="8" fill="#F1F5F9"/>
  <text x="1024" y="212" font-size="11" fill="#64748B">변경 레이어</text>
  <text x="1024" y="234" font-size="18" font-weight="700" fill="#0F172A">3 <tspan font-size="12" font-weight="500" fill="#94A3B8">/ 5</tspan></text>

  <line x1="1200" y1="200" x2="1200" y2="240" stroke="#CBD5E1"/>
  <text x="1216" y="212" font-size="11" fill="#64748B">변경 셀</text>
  <text x="1216" y="234" font-size="18" font-weight="700" fill="#DC2626">8<tspan font-size="12" font-weight="500" fill="#94A3B8">개</tspan></text>

  <line x1="1320" y1="200" x2="1320" y2="240" stroke="#CBD5E1"/>
  <text x="1336" y="212" font-size="11" fill="#64748B">기준 BB</text>
  <text x="1336" y="234" font-size="12" font-weight="600" fill="#0F172A">BB_v3.2</text>

  <!-- Search box -->
  <rect x="1012" y="260" width="396" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1"/>
  <g transform="translate(1024,270)" stroke="#94A3B8" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="5" cy="5" r="4"/>
    <line x1="8" y1="8" x2="11" y2="11"/>
  </g>
  <text x="1044" y="280" font-size="11" fill="#94A3B8">컬럼명 또는 값 검색...</text>

  <!-- Layer Section 1 (expanded) -->
  <rect x="1012" y="304" width="396" height="36" rx="6" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="1024" y="320" font-size="11" fill="#64748B">▾</text>
  <text x="1040" y="320" font-size="12" font-weight="700" fill="#0F172A">L2 · LITHO_DUV</text>
  <text x="1040" y="334" font-size="10" fill="#64748B">vs BB_LITHO_v3.2</text>
  <rect x="1340" y="312" width="58" height="20" rx="10" fill="#FEE2E2"/>
  <text x="1369" y="326" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">5개 변경</text>

  <!-- Comparison table header -->
  <rect x="1012" y="348" width="396" height="26" fill="#F8FAFC"/>
  <text x="1024" y="365" font-size="10" font-weight="600" fill="#64748B">분류</text>
  <text x="1066" y="365" font-size="10" font-weight="600" fill="#64748B">컬럼명</text>
  <text x="1232" y="365" font-size="10" font-weight="600" fill="#DC2626">Backbone</text>
  <text x="1330" y="365" font-size="10" font-weight="600" fill="#185E0F">현재</text>

  <!-- Row 1 -->
  <line x1="1012" y1="378" x2="1408" y2="378" stroke="#F1F5F9"/>
  <rect x="1024" y="386" width="28" height="16" rx="3" fill="#DBEAFE"/>
  <text x="1038" y="398" font-size="9" font-weight="700" fill="#1E40AF" text-anchor="middle">SP</text>
  <text x="1066" y="399" font-size="11" fill="#0F172A">Exposure_Energy</text>
  <text x="1232" y="399" font-size="11" fill="#DC2626" font-weight="600" text-decoration="line-through">26.0</text>
  <text x="1330" y="399" font-size="11" fill="#185E0F" font-weight="700">28.5</text>

  <!-- Row 2 -->
  <line x1="1012" y1="412" x2="1408" y2="412" stroke="#F1F5F9"/>
  <rect x="1024" y="420" width="28" height="16" rx="3" fill="#EDE9FE"/>
  <text x="1038" y="432" font-size="9" font-weight="700" fill="#6D28D9" text-anchor="middle">SC</text>
  <text x="1066" y="433" font-size="11" fill="#0F172A">Stage_Speed</text>
  <text x="1232" y="433" font-size="11" fill="#DC2626" font-weight="600" text-decoration="line-through">400</text>
  <text x="1330" y="433" font-size="11" fill="#185E0F" font-weight="700">450</text>

  <!-- Row 3 (added column) -->
  <line x1="1012" y1="446" x2="1408" y2="446" stroke="#F1F5F9"/>
  <rect x="1024" y="454" width="28" height="16" rx="3" fill="#D1FAE5"/>
  <text x="1038" y="466" font-size="9" font-weight="700" fill="#047857" text-anchor="middle">DEV</text>
  <text x="1066" y="467" font-size="11" fill="#0F172A">Dev_Time</text>
  <text x="1232" y="467" font-size="11" fill="#94A3B8" font-style="italic">-</text>
  <text x="1330" y="467" font-size="11" fill="#185E0F" font-weight="700">62</text>
  <rect x="1370" y="455" width="32" height="14" rx="7" fill="#DCFCE7"/>
  <text x="1386" y="465" font-size="8" font-weight="700" fill="#15803D" text-anchor="middle">추가</text>

  <!-- Row 4 -->
  <line x1="1012" y1="480" x2="1408" y2="480" stroke="#F1F5F9"/>
  <rect x="1024" y="488" width="28" height="16" rx="3" fill="#DBEAFE"/>
  <text x="1038" y="500" font-size="9" font-weight="700" fill="#1E40AF" text-anchor="middle">SP</text>
  <text x="1066" y="501" font-size="11" fill="#0F172A">NA_Setting</text>
  <text x="1232" y="501" font-size="11" fill="#DC2626" font-weight="600" text-decoration="line-through">1.20</text>
  <text x="1330" y="501" font-size="11" fill="#185E0F" font-weight="700">1.35</text>

  <!-- Row 5 -->
  <line x1="1012" y1="514" x2="1408" y2="514" stroke="#F1F5F9"/>
  <rect x="1024" y="522" width="28" height="16" rx="3" fill="#EDE9FE"/>
  <text x="1038" y="534" font-size="9" font-weight="700" fill="#6D28D9" text-anchor="middle">SC</text>
  <text x="1066" y="535" font-size="11" fill="#0F172A">Track_Recipe</text>
  <text x="1232" y="535" font-size="11" fill="#DC2626" font-weight="600" text-decoration="line-through">RCP_05</text>
  <text x="1330" y="535" font-size="11" fill="#185E0F" font-weight="700">RCP_07</text>

  <!-- Layer Section 2 (collapsed) -->
  <rect x="1012" y="560" width="396" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1024" y="576" font-size="11" fill="#64748B">▸</text>
  <text x="1040" y="576" font-size="12" font-weight="600" fill="#0F172A">L3 · ETCH_DRY</text>
  <text x="1040" y="590" font-size="10" fill="#64748B">vs BB_ETCH_v2.1</text>
  <rect x="1340" y="568" width="58" height="20" rx="10" fill="#FEE2E2"/>
  <text x="1369" y="582" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">2개 변경</text>

  <!-- Layer Section 3 (collapsed) -->
  <rect x="1012" y="604" width="396" height="36" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="1024" y="620" font-size="11" fill="#64748B">▸</text>
  <text x="1040" y="620" font-size="12" font-weight="600" fill="#0F172A">L5 · IMP</text>
  <text x="1040" y="634" font-size="10" fill="#64748B">vs BB_IMP_v1.4</text>
  <rect x="1340" y="612" width="58" height="20" rx="10" fill="#FEE2E2"/>
  <text x="1369" y="626" font-size="10" font-weight="700" fill="#DC2626" text-anchor="middle">1개 변경</text>

  <!-- Hint: click to navigate -->
  <text x="1012" y="676" font-size="10" fill="#94A3B8">  행 클릭 → 메인 그리드의 해당 셀로 자동 스크롤·하이라이트</text>
  <text x="1012" y="694" font-size="10" fill="#94A3B8">  null/undefined/"" 는 동일하게 취급 (불필요한 변경 노이즈 제거)</text>

  <!-- Arrow showing button → panel relation -->
  <path d="M1143 128 Q1143 140 1100 158" stroke="#1E3A8A" stroke-width="1.5" fill="none" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#1E3A8A"/>
    </marker>
  </defs>

  <!-- ===== Bottom: Legend / Compact mode in ReviewModal ===== -->
  <rect x="20" y="760" width="690" height="200" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="36" y="786" font-size="13" font-weight="700" fill="#0F172A">범례 &amp; 색상 규칙</text>

  <g font-size="12">
    <!-- BB color -->
    <rect x="36" y="804" width="14" height="14" rx="3" fill="#FEE2E2" stroke="#DC2626"/>
    <text x="58" y="815" fill="#0F172A" font-weight="600">Backbone 값</text>
    <text x="58" y="830" fill="#64748B" font-size="11">기준선(과거) 값 - 빨강 + 취소선</text>

    <rect x="240" y="804" width="14" height="14" rx="3" fill="#DCFCE7" stroke="#185E0F"/>
    <text x="262" y="815" fill="#0F172A" font-weight="600">현재 값</text>
    <text x="262" y="830" fill="#64748B" font-size="11">편집 중인 값 - 초록 + 굵게</text>

    <rect x="440" y="804" width="14" height="14" rx="3" fill="#94A3B8" opacity="0.4"/>
    <text x="462" y="815" fill="#0F172A" font-weight="600">"-" 표시</text>
    <text x="462" y="830" fill="#64748B" font-size="11">null 또는 미존재 (추가/삭제)</text>

    <!-- Category badges -->
    <text x="36" y="870" font-size="11" font-weight="700" fill="#475569">분류 배지:</text>
    <rect x="100" y="858" width="36" height="18" rx="4" fill="#DBEAFE"/>
    <text x="118" y="871" font-size="10" font-weight="700" fill="#1E40AF" text-anchor="middle">SP</text>
    <text x="142" y="871" font-size="10" fill="#64748B">스펙</text>

    <rect x="180" y="858" width="36" height="18" rx="4" fill="#EDE9FE"/>
    <text x="198" y="871" font-size="10" font-weight="700" fill="#6D28D9" text-anchor="middle">SC</text>
    <text x="222" y="871" font-size="10" fill="#64748B">셋팅</text>

    <rect x="262" y="858" width="36" height="18" rx="4" fill="#FEF3C7"/>
    <text x="280" y="871" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">OVL</text>
    <text x="304" y="871" font-size="10" fill="#64748B">오버레이</text>

    <rect x="358" y="858" width="36" height="18" rx="4" fill="#D1FAE5"/>
    <text x="376" y="871" font-size="10" font-weight="700" fill="#047857" text-anchor="middle">DEV</text>
    <text x="400" y="871" font-size="10" fill="#64748B">현상</text>

    <text x="36" y="910" font-size="11" font-weight="700" fill="#475569">사용 흐름:</text>
    <text x="100" y="910" font-size="11" fill="#334155">① 헤더 [BB 비교] 클릭 → ② 우측 패널 슬라이드 인 → ③ 변경 셀만 빨강/초록 비교</text>
    <text x="100" y="928" font-size="11" fill="#334155">④ 검색·접기·펴기 지원 → ⑤ 행 클릭 시 메인 그리드 해당 셀로 점프</text>
    <text x="100" y="946" font-size="11" fill="#334155">⑥ 헤더 배지 숫자 = totalChangedLayers (변경 레이어 수)</text>
  </g>

  <!-- ===== Bottom-right: Compact mode in ReviewRequestModal ===== -->
  <rect x="730" y="760" width="690" height="200" rx="10" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#shadow)"/>
  <text x="746" y="786" font-size="13" font-weight="700" fill="#0F172A">검토 요청 모달 (Compact Mode)</text>
  <text x="746" y="803" font-size="11" fill="#64748B">동일한 BackboneComparisonView를 compact prop으로 모달 내부에 임베드</text>

