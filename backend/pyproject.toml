[project]
name = "process-condition-manager-backend"
version = "0.0.0"
description = "PCM 백엔드 (Phase 0 골격 — 파라미터 레지스트리 + 적재 판독기 기반)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.1",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.1",
    "ruff>=0.8.0",
    "pyright>=1.1.390",
]

[tool.uv]
# 애플리케이션이므로 자체 패키지 빌드/설치는 하지 않는다.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["app", "tests"]
