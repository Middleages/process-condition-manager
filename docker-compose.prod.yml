version: '3.8'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-pcm}
      POSTGRES_USER: ${DB_USER:-pcm_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pcm_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pcm_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks:
      - pcm-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER:-pcm_user}:${DB_PASSWORD:-pcm_pass}@db:5432/${DB_NAME:-pcm}
      DATABASE_URL_SYNC: postgresql://${DB_USER:-pcm_user}:${DB_PASSWORD:-pcm_pass}@db:5432/${DB_NAME:-pcm}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "10"
    networks:
      - pcm-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pcm-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - pcm-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  pcm-network:
    driver: bridge
