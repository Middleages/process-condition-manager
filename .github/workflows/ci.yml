name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  backend:
    name: Backend lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pcm_test
          POSTGRES_USER: pcm_user
          POSTGRES_PASSWORD: pcm_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pcm_user -d pcm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # 동시성 테스트가 스키마를 생성/삭제하므로 애플리케이션 DB와 분리된 전용 DB만 쓴다.
      APP_TEST_DATABASE_URL: postgresql+asyncpg://pcm_user:pcm_pass@localhost:5432/pcm_test
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend typecheck, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
